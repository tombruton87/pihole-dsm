# Pi-hole on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=pihole
PKG_TITLE="Pi-hole"
PKG_DESC="Pi-hole, network-wide ad and tracker blocking, in Container Manager — answering DNS for every device on your network from your Synology. A DSM window shows what's blocked, pauses blocking for a while, manages blocklists and allowed or blocked sites, picks the upstream DNS, checks DSM isn't using port 53 already, and handles passwords, HTTPS, backups and updates."
APP_ID="PiHole.AppInstance"
REPO=tombruton87/pihole-dsm
SERVICES="server"
VOLUMES="etc"
IMAGE_VARS="PH_IMAGE"
PORT=8089
PORTS="8089 8091 8099 8189"
HEALTH_PATH=/api/info/login
APP_ACTIONS="pause|resume|listadd|listdel|gravity|domainadd|domaindel|upstream|newpw|refreshcert"
APP_ANSWER_KEYS="DNS_PORT TLS"
APP_REQUEST_KEYS="PAUSE_FOR URL_B64 LIST_ID KIND DOMAIN UPSTREAM CUSTOM_DNS TLS"
TAGLINE="ad blocking"
WELCOME="Pi-hole blocks ads, trackers and known bad sites for every device on your network — phones, TVs, consoles — by answering their DNS lookups from your Synology. This package runs it in Container Manager, sets its password, and adds a window to DSM: what's being blocked, pause for a while, blocklists, allowed and blocked sites, and how to point your router at it."
BACKUP_WHAT="Pi-hole's settings, blocklists, allowed and blocked sites, and the query history (its databases, copied consistently)."
SITE_NOTE="The address of Pi-hole's own web page. Devices don't use this for DNS — they use this Synology's address on port 53 (Setup tab). HTTPS can be served with DSM's own certificate (Control Panel → Security → Certificate, the system default; renewals are picked up daily) or a self-signed one."
ICON_TOP="#1f2a3a"
ICON_BOTTOM="#0b1220"
ICON_LETTER="P"   # only if icon.png is missing
BETA=yes
